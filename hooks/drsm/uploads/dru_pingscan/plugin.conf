# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_pingscan on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_pingscan
CATEGORY=uploads
DESCRIPTION="Hosts that answer a ping in a range from dr_utils pingscan --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# pingscan --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_pingscan_<SETTING>=value
TITLE="Ping sweep (pingscan)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_pingscan_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# How many hosts should answer depends on the network: set a floor per
# host, for example uploads_dru_pingscan_WARN_IF="up < 12"
METRICS="up down"
MAX_LINES=1000
