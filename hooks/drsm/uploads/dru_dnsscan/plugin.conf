# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_dnsscan on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_dnsscan
CATEGORY=uploads
DESCRIPTION="DNS names, forward checks and pings of a range from dr_utils dnsscan --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# dnsscan --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_dnsscan_<SETTING>=value
TITLE="DNS names (dnsscan)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_dnsscan_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# fwd_mismatch (with dnsscan -f) counts names that do not resolve back
# to their address.
WARN_IF="fwd_mismatch > 0"
METRICS="named fwd_mismatch up"
MAX_LINES=1000
