# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_sar_stats on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_sar_stats
CATEGORY=uploads
DESCRIPTION="Every sar section (CPU, memory, swap, paging, I/O, disks, network, load ...) from dr_utils sar_stats --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# sar_stats --submit sends DRSM lines: an INFO line, DETAIL values
# <section>_<column>_avg and _max for the whole system (CPU "all",
# memory, load ...) and <section>_<column>_max over the items of the
# other sections (disks, interfaces, file systems), and a table with a
# row per section.
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_sar_stats_<SETTING>=value
TITLE="sar report, every section (sar_stats)"
PLACE=host-section
DISPLAY=table
MAX_AGE_HOURS=30
# dru_sar_stats.sh runs from cron once a day: old data means it stopped.
# Limits depend on the host: add them per host, for example
#   uploads_dru_sar_stats_WARN_IF="cpu_pct_iowait_max > 50 or swpspace_pct_swpused_max > 50 or disk_pct_util_max > 90"
WARN_IF="cpu_pct_steal_max > 10"
CRIT_IF="files_failed > 0"
METRICS="cpu_pct_idle_avg cpu_pct_iowait_avg cpu_pct_iowait_max cpu_pct_steal_max mem_pct_memused_avg mem_pct_memused_max swpspace_pct_swpused_max queue_ldavg_1_avg queue_ldavg_1_max queue_runq_sz_max paging_majflt_s_max disk_pct_util_max disk_await_max net_dev_rxkb_s_max net_dev_txkb_s_max net_edev_rxerr_s_max fs_pct_fsused_max"
MAX_LINES=2000
