# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_mctest on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_mctest
CATEGORY=uploads
DESCRIPTION="Multicast rate and loss per receiver from dr_utils mctest --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# mctest --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_mctest_<SETTING>=value
TITLE="Multicast (mctest)"
PLACE=host-section
DISPLAY=table
# A benchmark runs by hand or from a schedule you choose: no age check.
# Set uploads_dru_mctest_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# Loss of the worst receiver, in percent
WARN_IF="loss_max_pct > 1"
CRIT_IF="loss_max_pct > 10"
METRICS="total loss_max_pct"
MAX_LINES=500
