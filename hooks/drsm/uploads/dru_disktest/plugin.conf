# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_disktest on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_disktest
CATEGORY=uploads
DESCRIPTION="DataReel B-tree insert, find, delete and reinsert times from dr_utils disktest --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# disktest --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_disktest_<SETTING>=value
TITLE="Disk benchmark (disktest)"
PLACE=host-section
DISPLAY=table
# A benchmark runs by hand or from a schedule you choose: no age check.
# Set uploads_dru_disktest_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# Times depend on the disk: set a limit per host, for example
# uploads_dru_disktest_WARN_IF="total > 60"
METRICS="total insert_time search_time delete_time reinsert_time"
MAX_LINES=500
