# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_report on the monitor
# host; hook.php reads it from [hooks] manifest_dir.
NAME=dru_report
CATEGORY=uploads
DESCRIPTION="HTML benchmark report (charts and tables) from dr_utils dr_report.py --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# One HTML file with its charts inside as PNG images. upload_view.php
# shows it in a sandbox with scripts blocked and data: images allowed.
# A report with many runs can be several MB: the report server's
# [hooks] max_bytes must allow it too.
FORMAT=html
MAX_BYTES=15000000
KEEP_HISTORY=10
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_report_<SETTING>=value
TITLE="Benchmark report"
PLACE=host-section
# The html display needs $UPLOADSdir in config/drsm.php on the dashboard
DISPLAY=html
# Made by hand: no age check
MAX_AGE_HOURS=0
MAX_LINES=100
