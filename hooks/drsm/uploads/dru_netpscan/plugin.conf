# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_netpscan on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_netpscan
CATEGORY=uploads
DESCRIPTION="Open TCP ports per address of a list from dr_utils netpscan --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# netpscan --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_netpscan_<SETTING>=value
TITLE="Port scan of a list (netpscan)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_netpscan_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# not_resolved counts names in the list that do not resolve. Set a limit
# for open ports per host, for example
# uploads_dru_netpscan_WARN_IF="not_resolved > 0 or open_ports > 20"
WARN_IF="not_resolved > 0"
METRICS="scanned up open_ports not_resolved"
MAX_LINES=1000
