# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_sar_cpu_stats on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_sar_cpu_stats
CATEGORY=uploads
DESCRIPTION="sar CPU averages, peaks, steal and iowait spikes and gaps from dr_utils sar_cpu_stats --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# sar_cpu_stats --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_sar_cpu_stats_<SETTING>=value
TITLE="CPU use from sar (sar_cpu_stats)"
PLACE=host-section
DISPLAY=table
MAX_AGE_HOURS=30
# dru_sar_cpu_stats.sh runs from cron once a day: old data means it stopped.
# Spike thresholds are sar_cpu_stats --steal and --iowait (10 and 20 %).
# Gaps and bad samples come with every reboot, so they are only trends;
# add "or gaps > 2" per host to warn on them.
WARN_IF="steal_spikes > 0 or iowait_spikes > 0"
CRIT_IF="files_failed > 0"
METRICS="busy_avg iowait_avg steal_avg idle_min steal_spikes iowait_spikes gaps bad_samples"
MAX_LINES=500
