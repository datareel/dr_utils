# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_file_hours on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_file_hours
CATEGORY=uploads
DESCRIPTION="Age of one file against a limit from dr_utils file_hours --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# file_hours --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_file_hours_<SETTING>=value
TITLE="Stale file check (file_hours)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_file_hours_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# stale is 1 when the file is the limit old or older (file_hours prints YES).
# A file that cannot be checked (missing) is an ERROR line in the data.
# One hook ID per checked file: use --submit=<id> and a copy of this
# folder named <id> (with NAME=<id>) for each extra file.
WARN_IF="stale == 1"
METRICS="age_hours"
MAX_LINES=1000
