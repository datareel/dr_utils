# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_file_purge on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_file_purge
CATEGORY=uploads
DESCRIPTION="Files purged, moved, kept or listed by dr_utils file_purge --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# file_purge --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_file_purge_<SETTING>=value
TITLE="File purge (file_purge)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_file_purge_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# errors counts files that could not be checked, deleted or moved.
WARN_IF="errors > 0"
METRICS="purged would_purge kept errors"
MAX_LINES=1000
