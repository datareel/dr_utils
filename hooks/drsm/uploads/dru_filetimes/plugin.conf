# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_filetimes on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_filetimes
CATEGORY=uploads
DESCRIPTION="Modification times and ages of files from dr_utils filetimes --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# filetimes --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_filetimes_<SETTING>=value
TITLE="File times (filetimes)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_filetimes_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# errors counts files that cannot be read (missing). For a stale feed,
# add a limit per host, for example
# uploads_dru_filetimes_WARN_IF="errors > 0 or newest_age_hours > 2"
WARN_IF="errors > 0"
METRICS="files errors newest_age_hours oldest_age_hours"
MAX_LINES=1000
