# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_portscan on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_portscan
CATEGORY=uploads
DESCRIPTION="Open TCP ports of one host from dr_utils portscan --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# portscan --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_portscan_<SETTING>=value
TITLE="Port check (portscan)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_portscan_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# Each port is a value (port_22=open or closed, 64 ports or fewer), so a
# host file can check the ones that matter, for example
# uploads_dru_portscan_CRIT_IF="port_443 != open"
# uploads_dru_portscan_WARN_IF="port_23 == open"
METRICS="open"
MAX_LINES=1000
