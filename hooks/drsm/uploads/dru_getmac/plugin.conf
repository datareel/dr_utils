# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_getmac on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_getmac
CATEGORY=uploads
DESCRIPTION="MAC address of one host on a local network from dr_utils getmac --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# getmac --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_getmac_<SETTING>=value
TITLE="MAC address (getmac)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_getmac_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# found is 0 when the host has no ARP entry (not on a local network, or
# it did not answer).
WARN_IF="found == 0"
METRICS="found"
MAX_LINES=1000
