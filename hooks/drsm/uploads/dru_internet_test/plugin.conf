# DRSM plugin manifest, see PLUGINS.md "Hook uploads" and dr_utils hooks/README.md
# dr_utils, GNU LGPL 3 or later
# Copy this folder to <drsm>/plugins/uploads/dru_internet_test on the monitor host;
# hook.php reads it from [hooks] manifest_dir.
NAME=dru_internet_test
CATEGORY=uploads
DESCRIPTION="DNS, TCP connect and HTTP check of a web server from dr_utils internet-test --submit"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# internet-test --submit sends DRSM lines: an INFO line with the result,
# DETAIL values for the rules and trends, and a table (UPLOAD
# columns/row lines).
FORMAT=drsm-lines
MAX_BYTES=1000000
KEEP_HISTORY=20
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_dru_internet_test_<SETTING>=value
TITLE="Internet connectivity (internet-test)"
PLACE=host-section
DISPLAY=table
# Runs by hand or from a schedule you choose: no age check. Set
# uploads_dru_internet_test_MAX_AGE_HOURS=<hours> on a host that runs it on a schedule.
MAX_AGE_HOURS=0
# passed is 1 when the server answered over HTTP. Run it with -c (a
# fixed number of tries) from a schedule.
CRIT_IF="passed == 0"
METRICS="passed tries seconds"
MAX_LINES=1000
